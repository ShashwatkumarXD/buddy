name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen  # build and run the real windows without a screen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  install:
    # The real one-liner on a fresh machine: fetches this commit's script and code, uv, Python, Qt.
    name: install on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      BUDDY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      BUDDY_QT_PLATFORM: offscreen  # buddy starts without a screen
    steps:
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install (Linux, macOS)
        if: runner.os != 'Windows'
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/$BUDDY_REF/install.sh" | bash -s pikachu
      - name: Buddy is running (Linux, macOS)
        if: runner.os != 'Windows'
        run: ~/.local/bin/buddy stop
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:BUDDY_POKEMON = "pikachu"
          irm "https://raw.githubusercontent.com/${{ github.repository }}/$env:BUDDY_REF/install.ps1" | iex
          buddy stop  # the plain command works in the same window, and buddy was running
          if ($LASTEXITCODE -ne 0) { exit 1 }
