[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "buddy"
version = "0.1.0"
description = "A Pokémon desktop buddy that shows when your laptop is stressed"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shashwat Kumar" }]
readme = "README.md"
dependencies = ["PySide6-Essentials>=6.6", "psutil", "Pillow"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
buddy = "buddy.cli:main"

[project.gui-scripts]
buddyw = "buddy.cli:main"  # Windows: starts buddy without a console window

[tool.setuptools]
packages = ["buddy"]

[tool.setuptools.package-data]
buddy = ["assets/bubbles/*.png", "assets/messages.toml", "guide.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
